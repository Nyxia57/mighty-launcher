name: Release

on:
  push:
    tags:
      - 'v*'   # Se déclenche sur : git tag v2.1.0 && git push origin v2.1.0

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            build_cmd: build:linux
            artifact: "dist/*.AppImage"
          - os: windows-latest
            build_cmd: build:win
            artifact: "dist/*.exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Nécessaire sur Linux pour construire les paquets natifs (AppImage)
      - name: Dépendances système Linux
        if: runner.os == 'Linux'
        run: sudo apt-get install -y rpm fakeroot

      - name: Build & Publier sur GitHub Releases
        run: npm run ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
